[workspace]
resolver = "3"
members = [
    "components/snafu-virtstack-macro",
    "components/snafu-virtstack",
    "components/common",
    "components/rpc",
    "components/client",
    "components/server",
    "components/extent-node",
    "components/stream-manager",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
snafu = "0.9"
snafu-virtstack = { path = "components/snafu-virtstack" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }
refinery = { version = "0.8", features = ["mysql_async"] }
mysql_async = "0.36"
fastant = "0.1"
crossbeam-channel = "0.5"
nix = { version = "0.31", features = ["net"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crc32fast = "1.5"
smallvec = "1.15"
tikv-jemallocator = "0.6"
core_affinity = "0.8"
papaya = "0.2"
parking_lot = "0.12"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.129.0" }
env_logger = { version = "0.11" }
zstd = { version = "0.13" }
lz4 = { version = "1.23.1" }

[package]
name = "stream-store"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
common = { path = "components/common" }
extent-node = { path = "components/extent-node" }
stream-manager = { path = "components/stream-manager" }
server = { path = "components/server" }
client = { path = "components/client" }
rpc = { path = "components/rpc" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
papaya = { workspace = true }
fastant = { workspace = true }
hdrhistogram = "7.5"
serial_test = "3"
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
snafu = { workspace = true }
snafu-virtstack = { workspace = true }
env_logger = { workspace = true }

[[bench]]
name = "concurrent_multi_stream"
harness = false

[[bench]]
name = "pipeline_append"
harness = false

[[bench]]
name = "pipeline_append_cluster"
harness = false

