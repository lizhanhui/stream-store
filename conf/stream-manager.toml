# StreamManager configuration
# All fields are optional — missing fields use defaults.

# IP to bind the TCP listener on. Defaults to 0.0.0.0 (all interfaces).
bind_ip = "0.0.0.0"

# Port to listen on. Defaults to 9800.
port = 9800

# MySQL connection settings
mysql_host = "tx.dev"
mysql_port = 3306
mysql_username = "root"
mysql_password = "password"
mysql_database = "stream_store"

# Replication
default_replication_factor = 2

# Heartbeat checker interval (ms)
heartbeat_check_interval_ms = 3000
