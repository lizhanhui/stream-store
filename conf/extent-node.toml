# ExtentNode configuration
# All fields are optional — missing fields use defaults.

# Unique node identifier for StreamManager registration.
# If omitted or empty, defaults to the advertise address ({advertise_ip}:{port}).
# node_id = "extent-node-1"

# IP to bind the TCP listener on. Defaults to 0.0.0.0 (all interfaces).
bind_ip = "0.0.0.0"

# Port to listen on. Defaults to 9801.
port = 9801

# IP advertised to StreamManager and other nodes.
# If omitted and bind_ip is 0.0.0.0, auto-detects the primary non-loopback interface IP.
# Set explicitly in multi-homed environments.
# advertise_ip = "192.168.1.100"

# StreamManager address(es) for registration and heartbeat.
# The EN tries each address in round-robin order on connection failure.
stream_manager_addrs = ["127.0.0.1:9800"]

# Heartbeat interval (ms)
heartbeat_interval_ms = 5000

# Replication quorum ACK timeout (ms). PendingAcks older than this are expired
# with an error to the client. Default: 500
# replication_timeout_ms = 500

# RPC TCP connect timeout (ms). Default: 500
# rpc_connect_timeout_ms = 500

# RPC request-response timeout for SM-facing calls (ms). Default: 2000
# rpc_request_timeout_ms = 2000
