apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-en-entrypoint
  labels:
    {{- include "stream-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: extent-node
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    cat > /tmp/config.toml <<EOF
    bind_ip = "0.0.0.0"
    port = {{ .Values.extentNode.port }}
    advertise_ip = "${POD_IP}"
    stream_manager_addrs = ["{{ .Release.Name }}-stream-manager:{{ .Values.streamManager.port }}"]
    heartbeat_interval_ms = {{ .Values.extentNode.heartbeatIntervalMs }}
    EOF
    exec /app/extent-node --config /tmp/config.toml
