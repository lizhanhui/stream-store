image:
  repository: stream-store
  tag: latest
  pullPolicy: IfNotPresent

mysql:
  image: mysql:8.0
  rootPassword: password
  database: stream_store
  port: 3306
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

streamManager:
  replicas: 1
  port: 9800
  replicationFactor: 2
  heartbeatCheckIntervalMs: 3000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

extentNode:
  replicas: 3
  port: 9801
  heartbeatIntervalMs: 5000
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

benchmark:
  enabled: true
  durationSecs: 120
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
